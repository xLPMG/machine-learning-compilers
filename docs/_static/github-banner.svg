      <text x="837" y="542" fill="#E4E9DD" font-size="14" font-weight="700" letter-spacing="1">GEMM / BRGEMM</text>
      <text x="823" y="563" fill="#91A69B" font-size="13">Single and batched matrix kernels</text>

