  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <rect x="88" y="112" width="8" height="8" rx="2" fill="#F27857"/>
    <text x="110" y="121" fill="#B8C9BD" font-size="16" font-weight="700" letter-spacing="2.2">AARCH64  /  NEON  /  TENSOR IR</text>

    <text x="84" y="220" fill="#F2F0E5" font-size="48" font-weight="700">Machine Learning</text>
    <text x="84" y="292" fill="#F2F0E5" font-size="48" font-weight="700">Compilers</text>
    <path d="M88 328H145" stroke="#F27857" stroke-width="4" stroke-linecap="round"/>
    <text x="88" y="374" fill="#BECBC2" font-size="23" font-weight="400">From tensor expressions</text>
    <text x="88" y="404" fill="#BECBC2" font-size="23" font-weight="400">to fast machine code.</text>

    <text x="88" y="490" fill="#8FA39A" font-size="15" font-weight="700" letter-spacing="1.6">GEMM  ·  EINSUM  ·  RUNTIME CODEGEN</text>
    <path d="M88 520H424" stroke="#CCD6CC" stroke-opacity=".2"/>
