      <text x="847" y="455" fill="#E4E9DD" font-size="15" font-weight="700" letter-spacing="1.5">VECTORIZE</text>
      <text x="847" y="480" fill="#91A69B" font-size="15">four lanes, one instruction</text>
      <text x="1058" y="455" fill="#E4E9DD" font-size="15" font-weight="700" letter-spacing="1.5">EXECUTE</text>
      <text x="1058" y="480" fill="#91A69B" font-size="15">native ARM instructions</text>
    </g>

